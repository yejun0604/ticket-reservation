services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ticket_reservation
      POSTGRES_USER: ticket_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_app -d ticket_reservation"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/ticket_reservation
      DB_USERNAME: ticket_app
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
